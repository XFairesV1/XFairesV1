<g class="screen">
<text x="24" y="72" class="p" textLength="126.0" lengthAdjust="spacingAndGlyphs">xfaires@dev:~$ </text><text x="150.0" y="72" class="c" textLength="92.4" lengthAdjust="spacingAndGlyphs">cat TODO.md</text><rect class="cov l0" x="24" y="55" width="720" height="24"/><text x="24" y="96" class="out" textLength="428.4" lengthAdjust="spacingAndGlyphs">- [ ] refatorar o login        (adicionado em 2023)</text><rect class="cov l1" x="24" y="79" width="720" height="24"/><text x="24" y="120" class="out" textLength="428.4" lengthAdjust="spacingAndGlyphs">- [ ] escrever testes          (adicionado em 2022)</text><rect class="cov l2" x="24" y="103" width="720" height="24"/><text x="24" y="144" class="p" textLength="126.0" lengthAdjust="spacingAndGlyphs">xfaires@dev:~$ </text><text x="150.0" y="144" class="c" textLength="151.2" lengthAdjust="spacingAndGlyphs">git blame login.py</text><rect class="cov l3" x="24" y="127" width="720" height="24"/><text x="24" y="168" class="warn" textLength="352.8" lengthAdjust="spacingAndGlyphs">Procurando quem escreveu essa gambiarra...</text><rect class="cov l4" x="24" y="151" width="720" height="24"/><text x="24" y="192" class="out" textLength="235.2" lengthAdjust="spacingAndGlyphs">Culpado: xfaires, há 8 meses</text><rect class="cov l5" x="24" y="175" width="720" height="24"/><text x="24" y="216" class="p" textLength="126.0" lengthAdjust="spacingAndGlyphs">xfaires@dev:~$ </text><text x="150.0" y="216" class="c" textLength="117.6" lengthAdjust="spacingAndGlyphs">python main.py</text><rect class="cov l6" x="24" y="199" width="720" height="24"/><text x="24" y="240" class="err" textLength="411.6" lengthAdjust="spacingAndGlyphs">TypeError: 'NoneType' object is not subscriptable</text><rect class="cov l7" x="24" y="223" width="720" height="24"/><text x="24" y="264" class="p" textLength="126.0" lengthAdjust="spacingAndGlyphs">xfaires@dev:~$ </text><text x="150.0" y="264" class="c" textLength="277.2" lengthAdjust="spacingAndGlyphs">grep -rn "print('chegou aqui')" .</text><rect class="cov l8" x="24" y="247" width="720" height="24"/><text x="24" y="288" class="out" textLength="294.0" lengthAdjust="spacingAndGlyphs">37 resultados. Nenhum deles ajudou.</text><rect class="cov l9" x="24" y="271" width="720" height="24"/><text x="24" y="312" class="p" textLength="126.0" lengthAdjust="spacingAndGlyphs">xfaires@dev:~$ </text><text x="150.0" y="312" class="c" textLength="159.6" lengthAdjust="spacingAndGlyphs">rm -rf node_modules</text><rect class="cov l10" x="24" y="295" width="720" height="24"/><text x="24" y="336" class="out" textLength="319.2" lengthAdjust="spacingAndGlyphs">4.2 GB liberados. O projeto tem 12 KB.</text><rect class="cov l11" x="24" y="319" width="720" height="24"/><text x="24" y="360" class="p" textLength="126.0" lengthAdjust="spacingAndGlyphs">xfaires@dev:~$ </text><text x="150.0" y="360" class="c" textLength="33.6" lengthAdjust="spacingAndGlyphs">exit</text><rect class="cov l12" x="24" y="343" width="720" height="24"/><text x="24" y="384" class="err" textLength="285.6" lengthAdjust="spacingAndGlyphs">exit: negado. Tem bug em produção.</text><rect class="cov l13" x="24" y="367" width="720" height="24"/><g class="last"><text x="24" y="408" class="p" textLength="126.0" lengthAdjust="spacingAndGlyphs">xfaires@dev:~$ </text><rect class="cur" x="152.0" y="394" width="9" height="18"/></g>
